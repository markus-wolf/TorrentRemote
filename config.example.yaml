qbittorrent:
  host: "your-server-hostname-or-ip"
  port: 8080
  username: "admin"
  password: "change-me"
  use_ssh_tunnel: true
  ssh_tunnel_local_port: 18080

ssh:
  host: "your-server-hostname-or-ip"
  port: 22
  user: "qbittorrent"
  key_path: "~/.ssh/id_rsa"

emby:
  host: "your-server-hostname-or-ip"
  port: 8096
  api_key: ""                  # Emby Dashboard → Advanced → API Keys (leave blank to disable)
  use_ssh_tunnel: false        # true = tunnel Emby through SSH (required for external access)
  ssh_tunnel_local_port: 18096 # local port on your Mac when tunnelling

downloads:
  movies: "/downloads/movies"
  tv:     "/downloads/tv"
  other:  "/downloads/other"
